<div class="container">
  <h2>Employee Details</h2>

  <table>
    <tr>
      <th>ID</th>
      <td>{{ employee.id }}</td>
    </tr>

    <tr>
      <th>Name</th>
      <td>{{ employee.name }}</td>
    </tr>

    <tr>
      <th>Email</th>
      <td>{{ employee.email }}</td>
    </tr>

    <tr>
      <th>Phone</th>
      <td>{{ employee.phone }}</td>
    </tr>

    <tr>
      <th>Department</th>
      <td>{{ employee.department }}</td>
    </tr>

    <tr>
      <th>Designation</th>
      <td>{{ employee.designation }}</td>
    </tr>

    <tr>
      <th>Salary</th>
      <td>{{ employee.salary }}</td>
    </tr>
  </table>
</div>
