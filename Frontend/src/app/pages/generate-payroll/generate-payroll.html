<app-toast
  [visible]="toastVisible"
  [message]="toastMessage"
  [type]="toastType">
</app-toast>

<div class="modal-backdrop" (click)="close()">
  <div class="modal-container" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Generate Payroll</h2>

      <button type="button" class="close-btn" (click)="close()">×</button>
    </div>

    <form [formGroup]="payrollForm">
      <div class="form-grid">
        <div class="employee-search-field">
          <app-form-field
            label="Employee ID"
            type="number"
            placeholder="Enter Employee ID"
            [control]="$any(payrollForm.controls['employeeId'])"
            errorMessage="Employee ID is required"
          >
          </app-form-field>

          <div class="search-button">
            <app-button
              text="Search"
              type="button"
              variant="primary"
              (buttonClick)="searchEmployee()"
            >
            </app-button>
          </div>
        </div>

        <app-form-field
          label="Employee Name"
          type="text"
          placeholder="Enter Employee Name"
          [control]="$any(payrollForm.controls['employeeName'])"
        >
        </app-form-field>

        <app-form-field
          label="Department"
          type="select"
          placeholder="Select Department"
          [control]="$any(payrollForm.controls['department'])"
          [options]="departmentOptions"
        >
        </app-form-field>

        <app-form-field
          label="Designation"
          type="select"
          placeholder="Select Designation"
          [control]="$any(payrollForm.controls['designation'])"
          [options]="designationOptions"
        >
        </app-form-field>

        <app-form-field
          label="Basic Salary"
          type="number"
          placeholder="Enter Basic Salary"
          [control]="$any(payrollForm.controls['basicSalary'])"
          (input)="calculateNetSalary()"
        >
        </app-form-field>

        <app-form-field
          label="Allowance"
          type="number"
          placeholder="Enter Allowance"
          [control]="$any(payrollForm.controls['allowance'])"
          (input)="calculateNetSalary()"
        >
        </app-form-field>

        <app-form-field
          label="Bonus"
          type="number"
          placeholder="Enter Bonus"
          [control]="$any(payrollForm.controls['bonus'])"
          (input)="calculateNetSalary()"
        >
        </app-form-field>

        <app-form-field
          label="Deduction"
          type="number"
          placeholder="Enter Deduction"
          [control]="$any(payrollForm.controls['deduction'])"
          (input)="calculateNetSalary()"
        >
        </app-form-field>

        <app-form-field
          label="Tax"
          type="number"
          placeholder="Enter Tax"
          [control]="$any(payrollForm.controls['tax'])"
          (input)="calculateNetSalary()"
        >
        </app-form-field>

        <app-form-field
          label="Net Salary"
          type="number"
          placeholder="Enter Net Salary"
          [control]="$any(payrollForm.controls['netSalary'])"
          [readonly]="true"
        >
        </app-form-field>

        <app-form-field
          label="Payment Status"
          type="select"
          placeholder="Select Payment Status"
          [control]="$any(payrollForm.controls['paymentStatus'])"
          [options]="paymentStatusOptions"
        >
        </app-form-field>

        <app-form-field
          label="Payment Date"
          type="date"
          [control]="$any(payrollForm.controls['paymentDate'])"
        >
        </app-form-field>
      </div>

      <div class="button-area">
        <app-button text="Cancel" type="button" variant="danger" (buttonClick)="close()">
        </app-button>

        <app-button
          text="Generate Payroll"
          type="button"
          variant="primary"
          [disabled]="payrollForm.invalid"
          (buttonClick)="generatePayroll()"
        >
        </app-button>
      </div>
    </form>
  </div>
</div>
