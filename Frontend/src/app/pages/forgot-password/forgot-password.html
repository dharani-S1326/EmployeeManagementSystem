<div class="modal-backdrop">
  <div class="modal-container">
    <div class="modal-header">
      <h2>
        <span class="material-icons">lock_reset</span>
        Forgot Password
      </h2>

      <button type="button" class="close-btn" (click)="closeForgotPassword()">×</button>
    </div>

    <div class="modal-body">
      <div class="info-box">
        <span class="material-icons"> info </span>

        <p>Enter your registered email address. We'll send you a password reset link.</p>
      </div>

      <form [formGroup]="forgotForm" (ngSubmit)="sendResetLink()">
        <app-form-field
          label="Email Address"
          type="email"
          placeholder="Enter your Email"
          [control]="$any(forgotForm.controls['email'])"
          errorMessage="Please enter a valid email address"
        >
        </app-form-field>

        <div class="send-button">
          <app-button
            text="Send Reset Link"
            type="submit"
            variant="primary"
            (buttonClick)="sendResetLink()"
          >
          </app-button>
        </div>
      </form>

      <div class="back-link">
        <a (click)="backToLogin()"> ← Back to Login Page </a>
      </div>
    </div>
  </div>
</div>

<app-toast [visible]="toastVisible" [message]="toastMessage" [type]="toastType"> </app-toast>
