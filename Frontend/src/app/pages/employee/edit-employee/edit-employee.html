<div class="container">
  <h2>Edit Employee</h2>

  <!-- ERROR MESSAGE -->

  <div class="error-message" *ngIf="errorMessage">
    {{ errorMessage }}
  </div>

  <form #editEmployeeForm="ngForm" (ngSubmit)="updateEmployee(editEmployeeForm)">
    <!-- NAME -->

    <label>
      Name
      <span class="required">*</span>
    </label>

    <input type="text" name="name" [(ngModel)]="employee.name" #name="ngModel" required />

    <div class="error-message" *ngIf="name.invalid && name.touched">Name is required.</div>

    <!-- EMAIL -->

    <label>
      Email
      <span class="required">*</span>
    </label>

    <input type="email" name="email" [(ngModel)]="employee.email" #email="ngModel" required email />

    <div class="error-message" *ngIf="email.invalid && email.touched">
      Please enter a valid email.
    </div>

    <!-- PHONE -->

    <label>
      Phone
      <span class="required">*</span>
    </label>

    <input
      type="text"
      name="phone"
      [ngModel]="employee.phone"
      (ngModelChange)="onPhoneChange($event)"
      #phone="ngModel"
      required
      minlength="10"
      maxlength="10"
      pattern="[0-9]{10}"
      inputmode="numeric"
      placeholder="Enter 10 digit phone number"
    />

    <div class="error-message" *ngIf="phone.invalid && phone.touched">
      <span *ngIf="phone.errors?.['required']"> Phone number is required. </span>

      <span
        *ngIf="
          !phone.errors?.['required'] && (phone.errors?.['pattern'] || phone.errors?.['minlength'])
        "
      >
        Phone number must contain exactly 10 digits.
      </span>
    </div>

    <!-- DEPARTMENT -->

    <label>
      Department
      <span class="required">*</span>
    </label>

    <select
      name="department"
      [(ngModel)]="employee.department"
      #department="ngModel"
      (ngChange)="onDepartmentChange()"
      required
    >
      <option value="">Select Department</option>

      <option *ngFor="let departmentName of departments" [value]="departmentName">
        {{ departmentName }}
      </option>
    </select>

    <div class="error-message" *ngIf="department.invalid && department.touched">
      Please select Department.
    </div>

    <!-- DESIGNATION -->

    <label>
      Designation
      <span class="required">*</span>
    </label>

    <select name="designation" [(ngModel)]="employee.designation" #designation="ngModel" required>
      <option value="">Select Designation</option>

      <option *ngFor="let designationName of designationOptions" [value]="designationName">
        {{ designationName }}
      </option>
    </select>

    <div class="error-message" *ngIf="designation.invalid && designation.touched">
      Please select Designation.
    </div>

    <!-- SALARY -->

    <label>
      Salary
      <span class="required">*</span>
    </label>

    <input
      type="number"
      name="salary"
      [(ngModel)]="employee.salary"
      #salary="ngModel"
      required
      min="1"
    />

    <div class="error-message" *ngIf="salary.invalid && salary.touched">
      Salary must be greater than 0.
    </div>

    <!-- BUTTONS -->

    <div class="button-group">
      <app-button
        text="Cancel"
        type="button"
        variant="danger"
        [disabled]="isSubmitting"
        (buttonClick)="cancel()"
      >
      </app-button>

      <app-button
        [text]="isSubmitting ? 'Updating...' : 'Update Employee'"
        type="submit"
        variant="primary"
        [disabled]="editEmployeeForm.invalid || isSubmitting"
      >
      </app-button>
    </div>
  </form>
</div>
