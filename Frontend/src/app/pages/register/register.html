<div class="modal-backdrop" (click)="closePopup()">
  <div class="register-modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Register Employee</h2>

      <button type="button" class="close-btn" (click)="closePopup()">×</button>
    </div>

    <app-toast [visible]="toastVisible" [message]="toastMessage" [type]="toastType"> </app-toast>

    <div class="auth-container">
      <div class="form-panel">
        <h2>Create Account</h2>

        <!-- WIZARD STEPS -->

        <div class="wizard-steps">
          <div class="wizard-step" [class.active]="currentStep >= 1">
            <span>1</span>

            <p>Personal</p>
          </div>

          <div class="wizard-line" [class.active]="currentStep >= 2"></div>

          <div class="wizard-step" [class.active]="currentStep >= 2">
            <span>2</span>

            <p>Account</p>
          </div>

          <div class="wizard-line" [class.active]="currentStep >= 3"></div>

          <div class="wizard-step" [class.active]="currentStep >= 3">
            <span>3</span>

            <p>Review</p>
          </div>
        </div>

        <form [formGroup]="registerForm" (ngSubmit)="register()">
          <div *ngIf="currentStep === 1">
            <h3 class="step-title">Personal Details</h3>

            <app-form-field
              label="Full Name"
              type="text"
              placeholder="Enter Name"
              [control]="$any(registerForm.controls.name)"
              errorMessage="Name is required"
            >
            </app-form-field>

            <app-form-field
              label="Email"
              type="email"
              placeholder="Enter Email"
              [control]="$any(registerForm.controls.email)"
              errorMessage="Please enter a valid email"
            >
            </app-form-field>

            <div class="wizard-actions">
              <app-button text="Next" type="button" variant="primary" (buttonClick)="nextStep()">
              </app-button>
            </div>
          </div>

          <div *ngIf="currentStep === 2">
            <h3 class="step-title">Account Details</h3>

            <app-form-field
              label="Password"
              type="password"
              placeholder="Enter Password"
              [control]="$any(registerForm.controls.password)"
              errorMessage="Password must be at least 6 characters"
            >
            </app-form-field>

            <app-form-field
              label="Confirm Password"
              type="password"
              placeholder="Confirm Password"
              [control]="$any(registerForm.controls.confirmPassword)"
              errorMessage="Confirm Password is required"
            >
            </app-form-field>

            <div
              class="error"
              *ngIf="
                registerForm.controls.confirmPassword.touched &&
                registerForm.value.password !== registerForm.value.confirmPassword
              "
            >
              Password and Confirm Password do not match.
            </div>

            <div class="role-field">
              <label for="role"> Role </label>

              <select id="role" formControlName="role">
                <option value="Employee">Employee</option>

                <option value="HR">HR</option>

                <option value="Admin">Admin</option>
              </select>
            </div>

            <div class="wizard-actions">
              <app-button
                text="Previous"
                type="button"
                variant="secondary"
                (buttonClick)="previousStep()"
              >
              </app-button>

              <app-button text="Next" type="button" variant="primary" (buttonClick)="nextStep()">
              </app-button>
            </div>
          </div>

          <div *ngIf="currentStep === 3">
            <h3 class="step-title">Review Details</h3>

            <div class="review-details">
              <div class="review-row">
                <span class="review-label"> Full Name </span>

                <span class="review-value">
                  {{ registerForm.value.name }}
                </span>
              </div>

              <div class="review-row">
                <span class="review-label"> Email </span>

                <span class="review-value">
                  {{ registerForm.value.email }}
                </span>
              </div>

              <div class="review-row">
                <span class="review-label"> Role </span>

                <span class="review-value">
                  {{ registerForm.value.role }}
                </span>
              </div>
            </div>

            <div class="wizard-actions">
              <app-button
                text="Previous"
                type="button"
                variant="secondary"
                (buttonClick)="previousStep()"
              >
              </app-button>

              <app-button text="Register" type="submit" variant="primary"> </app-button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
