<app-header></app-header>

<div class="leave-layout">
  <app-sidebar></app-sidebar>

  <main class="leave-container">
    <div class="page-header">
      <div class="page-title">
        <h2>Apply Leave</h2>

        <p>Submit a new leave request</p>
      </div>
    </div>

    <div class="apply-leave-card">
      <div class="form-header">
        <div class="form-icon">
          <i class="bi bi-calendar-plus"></i>
        </div>

        <div>
          <h3>Leave Request</h3>

          <p>Fill in the details below to submit your leave request.</p>
        </div>
      </div>

      <form [formGroup]="applyLeaveForm" (ngSubmit)="applyLeave()">
        <!-- LEAVE TYPE -->

        <app-form-field
          label="Leave Type"
          type="select"
          placeholder="Select Leave Type"
          [control]="leaveTypeControl"
          [options]="leaveTypes"
          errorMessage="Please select leave type"
        >
        </app-form-field>

        <!-- DATE ROW -->

        <div class="form-row">
          <app-form-field
            label="From Date"
            type="date"
            [control]="fromDateControl"
            errorMessage="From date is required"
          >
          </app-form-field>

          <app-form-field
            label="To Date"
            type="date"
            [control]="toDateControl"
            errorMessage="To date is required"
          >
          </app-form-field>
        </div>

        <!-- REASON -->

        <app-form-field
          label="Reason"
          type="textarea"
          placeholder="Enter the reason for your leave"
          [control]="reasonControl"
          errorMessage="Reason must contain at least 10 characters"
        >
        </app-form-field>

        <!-- MEDICAL CERTIFICATE -->

        <app-file-upload
          *ngIf="isSickLeave"
          label="Medical Certificate"
          accept=".pdf,.jpg,.jpeg,.png"
          [maxSizeMB]="5"
          (fileSelected)="onMedicalCertificateSelected($event)"
        >
        </app-file-upload>

        <!-- ACTION BUTTONS -->

        <div class="form-actions">
          <app-button text="Cancel" type="button" variant="outline" (buttonClick)="cancel()">
          </app-button>

          <app-button
            text="Apply Leave"
            type="submit"
            variant="primary"
            icon="bi bi-send"
            [disabled]="applyLeaveForm.invalid || isSubmitting"
          >
          </app-button>
        </div>
      </form>
    </div>
  </main>
</div>

<app-toast [visible]="toastVisible" [message]="toastMessage" [type]="toastType"> </app-toast>

<app-footer></app-footer>
