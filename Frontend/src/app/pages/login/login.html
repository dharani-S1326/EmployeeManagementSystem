
<div class="auth-container">
  <div class="form-panel">
    <div class="form-wrapper">
      <h2>Welcome Back</h2>

      <form [formGroup]="loginForm" (ngSubmit)="login()">
        <app-form-field
          label="Email"
          type="email"
          placeholder="Enter Email"
          [control]="$any(loginForm.controls.email)"
          errorMessage="Please enter a valid email"
        >
        </app-form-field>

        <app-form-field
          label="Password"
          type="password"
          placeholder="Enter Password"
          [control]="$any(loginForm.controls.password)"
          errorMessage="Password must be at least 6 characters"
        >
        </app-form-field>
        <div class="forgot">
          <a routerLink="/forgot-password"> Forgot Password? </a>
        </div>

        <div class="button-group">
          <app-button text="Log in" type="submit" variant="primary"> </app-button>
        </div>

        <!-- <p class="link">
                    Don't have an account?
                    <a routerLink="/register">Register</a>
                </p> -->
      </form>
    </div>
  </div>

  <div class="brand-panel">
    <div class="circle c1"></div>
    <div class="circle c2"></div>
    <div class="circle c3"></div>

    <div class="brand-content">
      <div class="eyebrow">Get Started</div>
      <p>Manage employees, departments, attendance and payroll with a secure and modern system.</p>
    </div>
  </div>
</div>
<app-toast
  [visible]="toastVisible"
  [message]="toastMessage"
  [type]="toastType">
</app-toast>
